name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v1.0.0). Leave blank to only build."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Signing is optional. Add the four repository secrets below and every build is
      # signed with your key, so new APKs install straight over the old one. Without
      # them the build still works and falls back to a throwaway debug key.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > todays-quote.jks
            echo "SIGNED_WITH=repository key" >> "$GITHUB_ENV"
          else
            echo "SIGNED_WITH=throwaway debug key (no signing secrets configured)" >> "$GITHUB_ENV"
          fi

      - name: Run tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: todays-quote.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Report the signing certificate
        run: |
          echo "Signed with: $SIGNED_WITH" >> "$GITHUB_STEP_SUMMARY"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs \
            app/build/outputs/apk/release/app-release.apk \
            | grep -i "SHA-256 digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Name the APK after its version
        id: rename
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "todays-quote-$VERSION.apk"
          echo "apk=todays-quote-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: todays-quote-apk
          path: ${{ steps.rename.outputs.apk }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Today's Quote ${{ inputs.release_tag || github.ref_name }}
          files: ${{ steps.rename.outputs.apk }}
          body: |
            Download the `.apk` below on your phone and open it to install.
            Requires Android 8.0 or newer.

            Signed with: ${{ env.SIGNED_WITH }}
